# Publica en producción (secretgift-app) cada push a main.
#
# Así producción es siempre lo que hay en main en GitHub, y no lo que
# tuviera la carpeta de alguien en su computador ese día. Si el análisis
# o las pruebas fallan, no se publica nada.
#
# Usa el secreto FIREBASE_SERVICE_ACCOUNT: la llave JSON de la cuenta de
# servicio github-deploy@secretgift-app (roles: Administrador de Firebase,
# de Cloud Functions, de Artifact Registry y Usuario de cuenta de servicio).
# Y, para el APK, ANDROID_KEYSTORE_BASE64 y ANDROID_KEYSTORE_PASSWORD.
name: Desplegar a producción

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nunca dos despliegues a la vez: el segundo espera al primero.
concurrency:
  group: produccion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desplegar:
    runs-on: ubuntu-latest
    env:
      # Los secretos no se pueden usar directamente en un `if`.
      TIENE_FIRMA: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.10
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release

      # El APK viaja con la web: queda en build/web/secretgift.apk y
      # secretgift.app/apk redirige ahí. Antes se copiaba a mano y cada
      # despliegue lo borraba.
      #
      # Se firma con la clave de la app (secretos ANDROID_KEYSTORE_BASE64 y
      # ANDROID_KEYSTORE_PASSWORD). Sin ellos no se compila APK: uno firmado
      # con otra clave no deja actualizar la app instalada y rompe los
      # enlaces de invitación, que Android ata a la huella de la firma.
      - uses: actions/setup-java@v4
        if: env.TIENE_FIRMA == 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Clave de firma Android
        if: env.TIENE_FIRMA == 'true'
        env:
          CLAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$CLAVE" | base64 -d > "$RUNNER_TEMP/firma.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/firma.jks" >> "$GITHUB_ENV"

      # El número de compilación sube con cada ejecución: Android no instala
      # encima una versión con versionCode menor que la instalada.
      - name: APK
        if: env.TIENE_FIRMA == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk build/web/secretgift.apk

      - name: Aviso si no hay APK
        if: env.TIENE_FIRMA != 'true'
        run: |
          echo "::warning::Sin secretos de firma Android. Esta publicación no lleva APK y /apk no descargará nada."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions

      # La llave va por variable de entorno y no pegada en el comando: así
      # ninguna comilla del JSON puede romper el shell.
      - name: Llave de la cuenta de servicio
        env:
          LLAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$LLAVE" > "$RUNNER_TEMP/llave.json"

      - name: firebase deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/llave.json
        run: >
          npx --yes firebase-tools@latest deploy
          --project secretgift-app
          --only hosting,functions,firestore:rules,storage
          --non-interactive --force
