<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- Sin esta etiqueta el navegador móvil asume un ancho de ~980px y
       escala la página entera. Faltaba por completo.

       NO se usa interactive-widget=resizes-content: se probó y empeora
       el problema del teclado en Chrome de Android. Ese valor encoge el
       viewport de MAQUETACIÓN al abrirse el teclado, y al cerrarse la
       vista se queda pequeña hasta recargar — medio pantallazo en
       blanco. Con el comportamiento por defecto el viewport de
       maquetación nunca encoge: el teclado se superpone y Flutter lo
       compensa leyendo visualViewport. Si nunca encoge, no hay nada que
       recuperar.

       Sin maximum-scale ni user-scalable=no a propósito: bloquear el
       zoom rompe la accesibilidad de quien necesita acercar. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="description" content="Secret Gift — Secret Friend and Secret Santa for your group.">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      /* Si por lo que sea queda una franja sin cubrir, que salga del
         color de la app y no blanca. */
      background-color: #F3E3E5;
    }
  </style>

  <!--
    EL BUG DEL TECLADO EN MÓVIL: resuelto subiendo Flutter, no con JS.

    Síntoma: al cerrar el teclado con el botón atrás quedaba una franja
    blanca abajo. <flutter-view> se quedaba con el alto que tenía el
    viewport MIENTRAS el teclado tapaba, y ya no se recuperaba.

                          visualViewport   alto de <flutter-view>
      teclado oculto           724                 724   correcto
      teclado abierto          380                 724   correcto
      al CERRAR el teclado     724                 380   <-- roto

    No era nuestro código: es flutter/flutter#175074, una regresión P1
    del engine ("[Android Web] resizeToAvoidBottomInset broken on
    Android"), presente desde 3.37 y corregida en 3.38.6. Este proyecto
    estaba en 3.38.5, justo la última versión afectada. Eso explica lo
    que ninguna otra hipótesis explicaba: que fallara IGUAL en todos los
    navegadores. El culpable era el engine, no el navegador.

    Aquí vivía un parche de JavaScript que forzaba
    `height: innerHeight px !important` sobre <flutter-view> a base de
    reintentos. Se retiró al subir a 3.38.10: si el engine ya mide bien,
    ese `!important` inline solo puede estorbar (gana sobre cualquier
    hoja de estilos y congela el alto).

    ANTES DE VOLVER A PARCHEAR ESTO CON JS O CSS: comprobar la versión
    de Flutter. Callejones sin salida ya recorridos, no repetirlos:
      - interactive-widget=resizes-content -> empeora (ver arriba).
      - CSS con !important -> NO gana sobre un estilo inline que
        también lleva !important. La precedencia es al revés.
  -->

  <script>
    // Diagnóstico bajo demanda: solo con ?diag=1 en la URL.
    (function () {
      if (!new URLSearchParams(location.search).has('diag')) return;
      var caja = document.createElement('div');
      caja.style.cssText = 'position:fixed;top:0;left:0;z-index:99999;' +
        'background:rgba(0,0,0,.8);color:#0f0;font:11px monospace;' +
        'padding:6px 8px;white-space:pre;pointer-events:none';
      document.addEventListener('DOMContentLoaded', function () {
        document.body.appendChild(caja);
      });
      setInterval(function () {
        var vv = window.visualViewport;
        var fv = document.querySelector('flutter-view');
        var r = fv ? fv.getBoundingClientRect() : null;
        caja.textContent =
          'innerH      ' + window.innerHeight + '\n' +
          'visualH     ' + (vv ? Math.round(vv.height) : '-') + '\n' +
          'scrollY     ' + Math.round(window.scrollY) + '\n' +
          'fv alto     ' + (r ? Math.round(r.height) : '-') + '\n' +
          // Con el engine ya corregido esto debe quedar SIEMPRE en
          // "(vacio)": nadie escribe el alto a mano. Si vuelve a salir un
          // valor en px, es que algo lo está forzando otra vez.
          'fv inline   ' + (fv && fv.style.height ? fv.style.height : '(vacio)');
      }, 250);
    })();
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Secret Gift">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Estos textos son estáticos: se sirven antes de que arranque
       Flutter, así que no pueden seguir al idioma que elija la persona.
       Van en inglés, que es el idioma por defecto de la app. -->
  <title>Secret Gift</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
