<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- Sin esta etiqueta el navegador móvil asume un ancho de ~980px y
       escala la página entera. Faltaba por completo.

       NO se usa interactive-widget=resizes-content: se probó y empeora
       el problema del teclado en Chrome de Android. Ese valor encoge el
       viewport de MAQUETACIÓN al abrirse el teclado, y al cerrarse la
       vista se queda pequeña hasta recargar — medio pantallazo en
       blanco. Con el comportamiento por defecto el viewport de
       maquetación nunca encoge: el teclado se superpone y Flutter lo
       compensa leyendo visualViewport. Si nunca encoge, no hay nada que
       recuperar.

       Sin maximum-scale ni user-scalable=no a propósito: bloquear el
       zoom rompe la accesibilidad de quien necesita acercar. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="description" content="Secret Gift — Secret Friend and Secret Santa for your group.">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      /* Si por lo que sea queda una franja sin cubrir, que salga del
         color de la app y no blanca. */
      background-color: #F3E3E5;
    }
  </style>

  <!--
    EL BUG DEL TECLADO EN MÓVIL: resuelto subiendo Flutter, no con JS.

    Síntoma: al cerrar el teclado con el botón atrás quedaba una franja
    blanca abajo. <flutter-view> se quedaba con el alto que tenía el
    viewport MIENTRAS el teclado tapaba, y ya no se recuperaba.

                          visualViewport   alto de <flutter-view>
      teclado oculto           724                 724   correcto
      teclado abierto          380                 724   correcto
      al CERRAR el teclado     724                 380   <-- roto

    No era nuestro código: es flutter/flutter#175074, una regresión P1
    del engine ("[Android Web] resizeToAvoidBottomInset broken on
    Android"), presente desde 3.37 y corregida en 3.38.6. Este proyecto
    estaba en 3.38.5, justo la última versión afectada. Eso explica lo
    que ninguna otra hipótesis explicaba: que fallara IGUAL en todos los
    navegadores. El culpable era el engine, no el navegador.

    Aquí vivía un parche de JavaScript que forzaba
    `height: innerHeight px !important` sobre <flutter-view> a base de
    reintentos. Se retiró al subir a 3.38.10: si el engine ya mide bien,
    ese `!important` inline solo puede estorbar (gana sobre cualquier
    hoja de estilos y congela el alto).

    ANTES DE VOLVER A PARCHEAR ESTO CON JS O CSS: comprobar la versión
    de Flutter. Callejones sin salida ya recorridos, no repetirlos:
      - interactive-widget=resizes-content -> empeora (ver arriba).
      - CSS con !important -> NO gana sobre un estilo inline que
        también lleva !important. La precedencia es al revés.
  -->

  <script>
    // Diagnóstico bajo demanda: solo con ?diag=1 en la URL.
    (function () {
      if (!new URLSearchParams(location.search).has('diag')) return;
      var caja = document.createElement('div');
      caja.style.cssText = 'position:fixed;top:0;left:0;z-index:99999;' +
        'background:rgba(0,0,0,.8);color:#0f0;font:11px monospace;' +
        'padding:6px 8px;white-space:pre;pointer-events:none';
      document.addEventListener('DOMContentLoaded', function () {
        document.body.appendChild(caja);
      });
      // Bitácora de eventos (22-oct): en qué orden se mueven el teclado, el
      // foco y el alto de la app. Las últimas 14 líneas, en ms desde la carga.
      var eventos = [];
      function anotar(texto) {
        eventos.push(Math.round(performance.now()) + ' ' + texto);
        if (eventos.length > 14) eventos.shift();
      }
      if (window.visualViewport) {
        visualViewport.addEventListener('resize', function () {
          anotar('vv ' + Math.round(visualViewport.height));
        });
        visualViewport.addEventListener('scroll', function () {
          anotar('vv top ' + Math.round(visualViewport.offsetTop));
        });
      }
      // Dónde está el campo oculto que Chrome intenta mostrar al abrir el
      // teclado, y dentro de qué vive (FORM con autocompletado).
      document.addEventListener('focusin', function (e) {
        var r = e.target.getBoundingClientRect();
        anotar('foco+ ' + e.target.tagName + ' en ' +
          (e.target.parentElement ? e.target.parentElement.tagName : '-') +
          ' top ' + Math.round(r.top) + ' alto ' + Math.round(r.height));
      });
      document.addEventListener('focusout', function (e) {
        anotar('foco- ' + e.target.tagName);
      });
      var altoAnterior = '';
      setInterval(function () {
        var vv = window.visualViewport;
        var fv = document.querySelector('flutter-view');
        var r = fv ? fv.getBoundingClientRect() : null;
        var alto = fv ? fv.style.height : '';
        if (alto !== altoAnterior) {
          anotar('fv ' + (alto || '(vacio)'));
          altoAnterior = alto;
        }
        // Pegado a lo que se ve: si Chrome desplaza la vista al abrir el
        // teclado (vv top > 0), el recuadro lo sigue en vez de escaparse.
        caja.style.top = (vv ? Math.round(vv.offsetTop) : 0) + 'px';
        caja.textContent =
          'innerH      ' + window.innerHeight + '\n' +
          'visualH     ' + (vv ? Math.round(vv.height) : '-') + '\n' +
          'vv top      ' + (vv ? Math.round(vv.offsetTop) : '-') + '\n' +
          'scrollY     ' + Math.round(window.scrollY) + '\n' +
          'fv top      ' + (r ? Math.round(r.top) : '-') + '\n' +
          'fv alto     ' + (r ? Math.round(r.height) : '-') + '\n' +
          // Desde 3.38.10 el engine sí escribe aquí el alto en px en cada
          // frame; lo que importa es que coincida con visualH.
          'fv inline   ' + (fv && fv.style.height ? fv.style.height : '(vacio)') + '\n' +
          'fv transf   ' + (fv && fv.style.transform ? fv.style.transform : '(vacio)') + '\n' +
          '---\n' + eventos.join('\n');
      }, 50);
    })();
  </script>

  <script>
    // Chrome de Android, al abrir el teclado, desplaza la vista (visual
    // viewport) para mostrar el campo enfocado si quedaba debajo. Pero el
    // engine encoge la app con `alto - visualViewport.height` sin mirar
    // offsetTop: Flutter dibuja desde arriba de la página y Chrome enseña una
    // franja más abajo. Resultado: la app corrida de más y un hueco sobre el
    // teclado. Medido el 27-oct con ?diag=1 en Entrar: vv top 151, fv top 0.
    //
    // window.scrollTo(0, 0) NO sirve: se probó (10 llamadas) y Chrome no
    // devuelve la vista. Lo que sí: bajar <flutter-view> lo mismo que Chrome
    // subió la vista, para que lo que dibuja Flutter caiga en lo visible. Los
    // toques siguen bien: el engine usa offsetX/Y, que respetan el transform.
    if (window.visualViewport) {
      var acompanar = function () {
        var fv = document.querySelector('flutter-view');
        if (!fv) return;
        var y = Math.round(visualViewport.offsetTop);
        // Con zoom el desplazamiento lo hace la persona: no acompañarlo.
        fv.style.transform = y > 0 && visualViewport.scale < 1.01
          ? 'translateY(' + y + 'px)' : '';
      };
      // También en resize: al cerrar el teclado la vista puede volver a 0
      // sin evento scroll, y la app quedaría corrida hacia abajo.
      visualViewport.addEventListener('scroll', acompanar);
      visualViewport.addEventListener('resize', acompanar);
    }
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Secret Gift">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Estos textos son estáticos: se sirven antes de que arranque
       Flutter, así que no pueden seguir al idioma que elija la persona.
       Van en inglés, que es el idioma por defecto de la app. -->
  <title>Secret Gift</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Checkout de Paddle (grupos adicionales). Ver web/pago.js. -->
  <script src="pago.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
